<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Canciones{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <header>
        <h1>Usuarios y canciones</h1>
        <nav>
            <a href="{{ url_for('usuarios.listar') }}">Usuarios</a>
            <a href="{{ url_for('canciones.listar') }}">Canciones</a>
        </nav>
    </header>
    <main>
        {% for mensaje in get_flashed_messages() %}
            <p class="mensaje">{{ mensaje }}</p>
        {% endfor %}
        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
